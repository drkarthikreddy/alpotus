<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPOTUS 5.0 - High-Yield Flashcards</title>
    <!-- Google Fonts & Tailwind -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #fffdf0; 
            color: #121212; 
        }
        /* 4:5 Ratio Box */
        .insta-post {
            aspect-ratio: 4 / 5;
            width: 100%;
            max-width: 420px;
        }
        /* 3D Flip Mechanics */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        /* Custom scrollbar for drug list points */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #eab308; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- HEADER & CONTROLS -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-white/95 border-b-2 border-black px-4 py-4 shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-col gap-4">
            
            <!-- Top Bar: Title & Counter -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
                <div>
                    <h1 class="text-2xl font-black tracking-tight text-black flex items-center gap-2">
                        <span class="bg-[#facc15] px-2 py-0.5 border-2 border-black rounded shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">ALPOTUS</span> 5.0
                    </h1>
                    <p class="text-xs text-neutral-600 font-semibold mt-0.5">Double-tap card to flip • Swipe sideways for sub-branches</p>
                </div>
                <div id="statsCounter" class="text-xs font-black bg-black text-[#facc15] px-3 py-1.5 border-2 border-black rounded-xl shadow-[2px_2px_0px_0px_rgba(250,204,21,1)]">
                    Showing 0 classifications
                </div>
            </div>

            <!-- Search Bar & Filters Bar -->
            <div class="flex flex-col md:flex-row gap-3 items-center justify-between pt-1">
                <!-- Search Bar -->
                <div class="relative w-full md:w-80">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-neutral-500 font-bold">🔍</span>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search classification name..." class="w-full pl-10 pr-4 py-2 bg-white border-2 border-black rounded-xl text-xs font-bold text-black focus:outline-none focus:ring-2 focus:ring-[#facc15] shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] placeholder:text-neutral-400">
                </div>

                <!-- Subject Filters -->
                <div id="subjectFilters" class="flex flex-wrap gap-2 justify-center md:justify-end w-full md:w-auto">
                    <button onclick="filterSubject('All')" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-[#facc15] text-black border-2 border-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] transition-all">All</button>
                </div>
            </div>

        </div>
    </header>

    <!-- FEED CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 mt-8">
        <div id="feedContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 justify-items-center">
            <!-- Dynamic posts rendered here -->
        </div>
    </main>

    <!-- LOAD DATA -->
    <script src="data.js"></script>
    <script>
        // --- 1. DATA HARVESTER ---
        let MasterDatabase = [];
        let currentSubjectFilter = 'All';
        let currentSearchQuery = '';

        function compileDatabase() {
            if (typeof ClassificationData !== 'undefined') {
                for (let subj in ClassificationData) {
                    let chapters = ClassificationData[subj].chapters;
                    for (let chap in chapters) {
                        chapters[chap].forEach(item => {
                            MasterDatabase.push({
                                id: item.id || Math.random().toString(),
                                name: item.name,
                                subject: subj,
                                chapter: chap,
                                categories: item.categories,
                                items: item.items
                            });
                        });
                    }
                }
            }

            if (typeof MyAddedClassifications !== 'undefined') {
                MyAddedClassifications.forEach(add => {
                    let catMap = {};
                    add.categories.forEach(cat => catMap[cat] = []);
                    add.items.forEach(it => {
                        if (!catMap[it.category]) catMap[it.category] = [];
                        catMap[it.category].push(it);
                    });

                    let subBranches = Object.keys(catMap).map(catName => ({
                        subBranchName: catName,
                        drugs: catMap[catName]
                    }));

                    MasterDatabase.push({
                        id: add.id,
                        name: add.name,
                        subject: add.subject || "Pharmacology",
                        chapter: add.chapter || "Autocoids",
                        subBranches: subBranches
                    });
                });
            }

            MasterDatabase = MasterDatabase.map(post => {
                if (!post.subBranches) {
                    let catMap = {};
                    post.categories.forEach(c => catMap[c] = []);
                    post.items.forEach(i => {
                        if (!catMap[i.category]) catMap[i.category] = [];
                        catMap[i.category].push(i);
                    });
                    post.subBranches = Object.keys(catMap).map(c => ({
                        subBranchName: c,
                        drugs: catMap[c]
                    }));
                }
                return post;
            });
        }

        // --- 2. FILTER & SEARCH CONTROLLER ---
        function filterSubject(subject) {
            currentSubjectFilter = subject;
            
            // Highlight active button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if(btn.innerText.toLowerCase() === subject.toLowerCase()) {
                    btn.className = "filter-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-[#facc15] text-black border-2 border-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] transition-all";
                } else {
                    btn.className = "filter-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white text-black border-2 border-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] hover:bg-neutral-100 transition-all";
                }
            });

            applyFiltersAndRender();
        }

        function handleSearch() {
            currentSearchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            applyFiltersAndRender();
        }

        function applyFiltersAndRender() {
            let filtered = MasterDatabase.filter(post => {
                let matchesSubject = (currentSubjectFilter === 'All' || post.subject.toLowerCase() === currentSubjectFilter.toLowerCase());
                let matchesSearch = (post.name.toLowerCase().includes(currentSearchQuery) || post.chapter.toLowerCase().includes(currentSearchQuery));
                return matchesSubject && matchesSearch;
            });

            renderFeed(filtered);
        }

        // --- 3. RENDER ENGINE ---
        function renderFeed(postsToRender) {
            const container = document.getElementById('feedContainer');
            container.innerHTML = '';

            // Update stats counter
            document.getElementById('statsCounter').innerText = `Showing ${postsToRender.length} classifications`;

            if(postsToRender.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-white border-2 border-black rounded-2xl shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] max-w-md w-full mx-auto">
                        <p class="text-lg font-black text-black">No Classifications Found</p>
                        <p class="text-xs text-neutral-500 font-semibold mt-1">Try adjusting your search query or subject filter.</p>
                    </div>
                `;
                return;
            }

            postsToRender.forEach((post, postIdx) => {
                const cardId = `post-${postIdx}`;
                
                let postEl = document.createElement('div');
                postEl.className = "insta-post bg-white border-2 border-black rounded-2xl shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex flex-col overflow-hidden relative";
                
                // Post Header
                let headerHTML = `
                    <div class="px-4 py-3 bg-[#facc15] border-b-2 border-black flex justify-between items-center z-10">
                        <div>
                            <span class="text-[10px] uppercase tracking-wider font-extrabold px-2 py-0.5 rounded bg-black text-white">${post.subject}</span>
                            <h2 class="text-xs font-extrabold text-black mt-1 truncate max-w-[240px]">${post.name}</h2>
                        </div>
                        <div class="text-right">
                            <span class="text-xs text-black font-extrabold bg-white px-2 py-0.5 border border-black rounded shadow-[1px_1px_0px_0px_rgba(0,0,0,1)] card-counter">1/${post.subBranches.length}</span>
                        </div>
                    </div>
                `;

                // Carousel Container for Sub-branches
                let carouselHTML = `<div class="flex-1 relative overflow-hidden flex items-center justify-center p-4 bg-[#fffdfa]">`;
                let slidesHTML = `<div class="carousel-track flex h-full w-full transition-transform duration-300 ease-out" id="track-${cardId}">`;

                post.subBranches.forEach((branch, bIdx) => {
                    slidesHTML += `
                        <div class="carousel-slide min-w-full h-full flex flex-col justify-center perspective-1000 px-1">
                            <div class="w-full h-full relative transform-style-3d transition-transform duration-500 cursor-pointer card-inner rounded-xl bg-white border-2 border-black shadow-[3px_3px_0px_0px_rgba(0,0,0,1)]" ondblclick="toggleFlip(this)">
                                
                                <!-- FRONT SIDE: STRICTLY SUB-BRANCH NAME ONLY -->
                                <div class="backface-hidden absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-white rounded-xl">
                                    <h3 class="text-xl font-black text-black leading-tight mb-2">${branch.subBranchName}</h3>
                                    <span class="absolute bottom-4 text-[10px] font-extrabold text-amber-600 bg-amber-100 px-3 py-1 border border-black rounded-full shadow-[1px_1px_0px_0px_rgba(0,0,0,1)]">⚡ Double tap to flip</span>
                                </div>

                                <!-- BACK SIDE: DRUGS LIST -->
                                <div class="backface-hidden absolute inset-0 rotate-y-180 flex flex-col p-4 bg-white rounded-xl overflow-hidden">
                                    <div class="flex justify-between items-center border-b-2 border-black pb-2 mb-2 bg-[#fef08a] -mx-4 -mt-4 px-4 pt-4">
                                        <h4 class="text-xs font-black text-black truncate max-w-[220px]">${branch.subBranchName}</h4>
                                        <span class="text-[9px] font-extrabold bg-black text-white px-1.5 py-0.5 rounded">DRUGS</span>
                                    </div>
                                    <div class="flex-1 overflow-y-auto custom-scroll space-y-2 pr-1">
                                        ${branch.drugs && branch.drugs.length > 0 ? branch.drugs.map(drug => `
                                            <div class="bg-neutral-50 border border-black/80 p-2 rounded-lg shadow-[1px_1px_0px_0px_rgba(0,0,0,1)]">
                                                <div class="text-xs font-black text-black">${drug.name}</div>
                                                ${drug.note ? `<div class="text-[10px] text-neutral-600 font-medium mt-0.5 leading-tight">${drug.note}</div>` : ''}
                                            </div>
                                        `).join('') : '<div class="text-xs text-neutral-400 text-center py-8 font-semibold">No specific drugs listed.</div>'}
                                    </div>
                                    <div class="text-center pt-2 border-t border-neutral-200 text-[9px] font-bold text-neutral-500">Double tap to flip back</div>
                                </div>

                            </div>
                        </div>
                    `;
                });

                slidesHTML += `</div>`;
                carouselHTML += slidesHTML;

                // Swipe Arrow Controls
                if(post.subBranches.length > 1) {
                    carouselHTML += `
                        <button onclick="slideCard('${cardId}', -1)" class="absolute left-2 z-20 bg-white hover:bg-[#facc15] text-black font-black w-8 h-8 rounded-full shadow border-2 border-black flex items-center justify-center transition">‹</button>
                        <button onclick="slideCard('${cardId}', 1)" class="absolute right-2 z-20 bg-white hover:bg-[#facc15] text-black font-black w-8 h-8 rounded-full shadow border-2 border-black flex items-center justify-center transition">›</button>
                    `;
                }

                carouselHTML += `</div>`;

                // Footer Dots Pagination Indicator
                let dotsHTML = `
                    <div class="py-2.5 bg-white border-t-2 border-black flex justify-center items-center gap-1.5 z-10" id="dots-${cardId}">
                        ${post.subBranches.map((_, dIdx) => `
                            <span onclick="goToSlide('${cardId}', ${dIdx})" class="h-2 rounded-full transition-all cursor-pointer border border-black ${dIdx === 0 ? 'w-5 bg-[#facc15]' : 'w-2 bg-neutral-300'}"></span>
                        `).join('')}
                    </div>
                `;

                postEl.innerHTML = headerHTML + carouselHTML + dotsHTML;
                container.appendChild(postEl);

                setupTouchSwipe(cardId, post.subBranches.length);
            });
        }

        // --- 4. INTERACTION CONTROLLERS ---
        let currentSlides = {};

        function toggleFlip(cardInner) {
            cardInner.classList.toggle('rotate-y-180');
        }

        function slideCard(cardId, direction) {
            if(!currentSlides[cardId]) currentSlides[cardId] = 0;
            let total = document.querySelectorAll(`#track-${cardId} .carousel-slide`).length;
            
            currentSlides[cardId] += direction;
            if(currentSlides[cardId] < 0) currentSlides[cardId] = 0;
            if(currentSlides[cardId] >= total) currentSlides[cardId] = total - 1;

            updateCarouselView(cardId);
        }

        function goToSlide(cardId, index) {
            currentSlides[cardId] = index;
            updateCarouselView(cardId);
        }

        function updateCarouselView(cardId) {
            let idx = currentSlides[cardId] || 0;
            let track = document.getElementById(`track-${cardId}`);
            track.style.transform = `translateX(-${idx * 100}%)`;

            let postContainer = track.closest('.insta-post');
            let total = track.children.length;
            postContainer.querySelector('.card-counter').innerText = `${idx + 1}/${total}`;

            let dots = postContainer.querySelectorAll(`#dots-${cardId} span`);
            dots.forEach((dot, dIdx) => {
                if(dIdx === idx) {
                    dot.className = "h-2 rounded-full transition-all cursor-pointer border border-black w-5 bg-[#facc15]";
                } else {
                    dot.className = "h-2 rounded-full transition-all cursor-pointer border border-black w-2 bg-neutral-300";
                }
            });
        }

        function setupTouchSwipe(cardId, totalSlides) {
            let track = document.getElementById(`track-${cardId}`);
            let startX = 0;
            let endX = 0;

            track.addEventListener('touchstart', e => {
                startX = e.changedTouches[0].screenX;
            }, {passive: true});

            track.addEventListener('touchend', e => {
                endX = e.changedTouches[0].screenX;
                handleSwipe(cardId, startX, endX, totalSlides);
            }, {passive: true});
        }

        function handleSwipe(cardId, startX, endX, totalSlides) {
            if(!currentSlides[cardId]) currentSlides[cardId] = 0;
            let threshold = 50;
            if (startX - endX > threshold) {
                if(currentSlides[cardId] < totalSlides - 1) {
                    currentSlides[cardId]++;
                    updateCarouselView(cardId);
                }
            } else if (endX - startX > threshold) {
                if(currentSlides[cardId] > 0) {
                    currentSlides[cardId]--;
                    updateCarouselView(cardId);
                }
            }
        }

        function buildFilters() {
            let subjects = new Set();
            MasterDatabase.forEach(p => subjects.add(p.subject));
            
            let filterContainer = document.getElementById('subjectFilters');
            subjects.forEach(subj => {
                let btn = document.createElement('button');
                btn.className = "filter-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white text-black border-2 border-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] hover:bg-neutral-100 transition-all";
                btn.innerText = subj;
                btn.onclick = () => filterSubject(subj);
                filterContainer.appendChild(btn);
            });
        }

        window.onload = function() {
            compileDatabase();
            buildFilters();
            applyFiltersAndRender();
        };
    </script>
</body>
</html>
