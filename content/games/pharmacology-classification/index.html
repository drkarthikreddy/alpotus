<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPOTUS 5.0 - Pharmacards</title>
    <!-- Google Fonts & Tailwind -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #fffdf0; 
            color: #121212; 
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        input {
            -webkit-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        /* 4:5 Ratio Box */
        .insta-post {
            aspect-ratio: 4 / 5;
            width: 100%;
            max-width: 420px;
        }
        /* 3D Flip Mechanics */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        /* Custom scrollbars */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #eab308; border-radius: 4px; }

        /* Smooth Header Hide/Show Transition */
        #mainHeader {
            transition: transform 0.25s ease-in-out;
        }
        .header-hidden {
            transform: translateY(-100%);
        }
    </style>
</head>
<body class="min-h-screen pb-20 pt-16">

    <!-- MINIMALIST STICKY HEADER -->
    <header id="mainHeader" class="fixed top-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-md border-b border-neutral-200 px-4 py-2.5">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-2 sm:gap-3">
            
            <!-- Left: Brand -->
            <div class="flex items-center gap-1.5 shrink-0">
                <span class="text-xs font-black tracking-tight bg-[#facc15] px-2 py-1 rounded border border-neutral-300">ALPOTUS</span>
            </div>

            <!-- Middle: Compact Search Bar -->
            <div class="relative flex-1 max-w-md">
                <span class="absolute inset-y-0 left-0 flex items-center pl-2.5 pointer-events-none text-neutral-400 text-xs">🔍</span>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search classification..." class="w-full pl-8 pr-3 py-1.5 bg-neutral-100 border border-neutral-300 rounded-lg text-xs font-bold text-black focus:outline-none focus:ring-2 focus:ring-[#facc15] placeholder:text-neutral-400">
            </div>

            <!-- Right: Filter & Custom Deck Actions -->
            <div class="flex items-center gap-1.5 shrink-0">
                <button onclick="toggleDeckModal()" class="bg-neutral-100 hover:bg-neutral-200 text-black px-2.5 py-1.5 rounded-lg border border-neutral-300 flex items-center gap-1 text-xs font-bold transition cursor-pointer" title="Custom Decks">
                    <span>📁 Decks</span>
                </button>
                <button onclick="toggleFilterDrawer()" class="relative bg-[#facc15] hover:bg-amber-300 text-black p-1.5 px-2.5 rounded-lg border border-neutral-300 flex items-center gap-1 text-xs font-bold transition cursor-pointer" title="Filters">
                    <span>⚙️</span>
                    <span id="activeFilterBadge" class="hidden absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-500 border border-white rounded-full"></span>
                </button>
            </div>

        </div>
    </header>

    <!-- CHAPTER MULTI-SELECT FILTER DRAWER (MODAL) -->
    <div id="filterDrawer" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm hidden flex justify-end">
        <div class="bg-white w-full max-w-sm h-full border-l border-neutral-200 p-5 flex flex-col overflow-y-auto">
            <div class="flex justify-between items-center border-b border-neutral-200 pb-3 mb-4">
                <h3 class="text-xs font-black uppercase tracking-wider">Filter Chapters</h3>
                <button onclick="toggleFilterDrawer()" class="text-black font-black text-sm px-2 border border-neutral-300 rounded bg-neutral-100 cursor-pointer">✕</button>
            </div>

            <div class="flex gap-2 mb-4">
                <button onclick="selectAllChapters(true)" class="flex-1 px-2 py-1 text-[11px] font-bold border border-neutral-300 bg-[#facc15] rounded-lg cursor-pointer">Select All</button>
                <button onclick="selectAllChapters(false)" class="flex-1 px-2 py-1 text-[11px] font-bold border border-neutral-300 bg-neutral-100 rounded-lg cursor-pointer">Clear All</button>
            </div>

            <div id="chapterFilterList" class="space-y-4 flex-1 pb-4">
                <!-- Dynamically populated checkboxes -->
            </div>

            <button onclick="applyChapterFilters()" class="w-full py-2 bg-black text-[#facc15] font-black text-xs rounded-xl cursor-pointer mt-auto">Apply Filters</button>
        </div>
    </div>

    <!-- CUSTOM DECK MANAGER MODAL -->
    <div id="deckModal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md border border-neutral-200 p-5 rounded-2xl flex flex-col shadow-xl max-h-[90vh]">
            <div class="flex justify-between items-center border-b border-neutral-200 pb-3 mb-4">
                <h3 class="text-xs font-black uppercase tracking-wider">Custom Decks & Folders</h3>
                <button onclick="toggleDeckModal()" class="text-black font-black text-sm px-2 border border-neutral-300 rounded bg-neutral-100 cursor-pointer">✕</button>
            </div>

            <!-- Create Deck Input -->
            <div class="flex gap-2 mb-4">
                <input type="text" id="newDeckName" placeholder="New folder/deck name..." class="flex-1 px-3 py-1.5 bg-neutral-100 border border-neutral-300 rounded-lg text-xs font-bold focus:outline-none">
                <button onclick="createNewDeck()" class="bg-[#facc15] border border-neutral-300 px-3 py-1.5 rounded-lg text-xs font-black cursor-pointer">Create</button>
            </div>

            <!-- Decks List -->
            <div id="decksListContainer" class="space-y-3 flex-1 overflow-y-auto pr-1">
                <!-- Dynamically populated decks -->
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 mt-6">
        <!-- Active Filter Bar Display -->
        <div id="activeFilterBar" class="hidden mb-4 flex items-center justify-between bg-white border border-neutral-200 px-3 py-1.5 rounded-xl text-xs font-bold">
            <span id="activeFilterText">Active Filters: None</span>
            <button onclick="clearAllFilters()" class="text-red-600 font-extrabold underline cursor-pointer">Reset Filters</button>
        </div>

        <div id="feedContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 justify-items-center">
            <!-- Dynamic posts rendered here -->
        </div>
    </main>

    <!-- LOAD DATA -->
    <script src="data.js"></script>
    <script>
        // --- 1. DATA HARVESTER & PERSISTENT STATE ---
        let MasterDatabase = [];
        let selectedChapters = new Set();
        let currentSearchQuery = '';
        let customDecks = {}; // { deckName: [postId1, postId2] }
        let activeDeckFilter = null; // null = show all based on chapter/search, string = show only items in this deck

        function loadPersistentState() {
            let savedSearch = localStorage.getItem('alpotus_search');
            if(savedSearch !== null) {
                currentSearchQuery = savedSearch;
                document.getElementById('searchInput').value = savedSearch;
            }

            let savedChapters = localStorage.getItem('alpotus_chapters');
            if(savedChapters !== null) {
                try {
                    selectedChapters = new Set(JSON.parse(savedChapters));
                } catch(e) { selectedChapters = new Set(); }
            }

            let savedDecks = localStorage.getItem('alpotus_decks');
            if(savedDecks !== null) {
                try {
                    customDecks = JSON.parse(savedDecks);
                } catch(e) { customDecks = {}; }
            }
        }

        function savePersistentState() {
            localStorage.setItem('alpotus_search', currentSearchQuery);
            localStorage.setItem('alpotus_chapters', JSON.stringify(Array.from(selectedChapters)));
            localStorage.setItem('alpotus_decks', JSON.stringify(customDecks));
        }

        // Header Scroll Hide/Show
        let lastScrollTop = 0;
        window.addEventListener('scroll', function() {
            let st = window.pageYOffset || document.documentElement.scrollTop;
            let header = document.getElementById('mainHeader');
            if (st > lastScrollTop && st > 50) {
                header.classList.add('header-hidden');
            } else {
                header.classList.remove('header-hidden');
            }
            lastScrollTop = st <= 0 ? 0 : st;
        }, { passive: true });

        function compileDatabase() {
            if (typeof ClassificationData !== 'undefined') {
                for (let subj in ClassificationData) {
                    let chapters = ClassificationData[subj].chapters;
                    for (let chap in chapters) {
                        chapters[chap].forEach(item => {
                            MasterDatabase.push({
                                id: item.id || `base-${Math.random().toString(36).substr(2, 9)}`,
                                name: item.name,
                                subject: subj,
                                chapter: chap,
                                categories: item.categories,
                                items: item.items
                            });
                        });
                    }
                }
            }

            if (typeof MyAddedClassifications !== 'undefined') {
                MyAddedClassifications.forEach(add => {
                    let catMap = {};
                    add.categories.forEach(cat => catMap[cat] = []);
                    add.items.forEach(it => {
                        if (!catMap[it.category]) catMap[it.category] = [];
                        catMap[it.category].push(it);
                    });

                    let subBranches = Object.keys(catMap).map(catName => ({
                        subBranchName: catName,
                        drugs: catMap[catName]
                    }));

                    MasterDatabase.push({
                        id: add.id || `add-${Math.random().toString(36).substr(2, 9)}`,
                        name: add.name,
                        subject: add.subject || "Pharmacology",
                        chapter: add.chapter || "Autocoids",
                        subBranches: subBranches
                    });
                });
            }

            MasterDatabase = MasterDatabase.map(post => {
                if (!post.subBranches) {
                    let catMap = {};
                    post.categories.forEach(c => catMap[c] = []);
                    post.items.forEach(i => {
                        if (!catMap[i.category]) catMap[i.category] = [];
                        catMap[i.category].push(i);
                    });
                    post.subBranches = Object.keys(catMap).map(c => ({
                        subBranchName: c,
                        drugs: catMap[c]
                    }));
                }
                return post;
            });

            let allChaps = getAllChapters();
            if(localStorage.getItem('alpotus_chapters') === null) {
                allChaps.forEach(c => selectedChapters.add(c));
            }
        }

        function getAllChapters() {
            let set = new Set();
            MasterDatabase.forEach(p => set.add(p.chapter));
            return Array.from(set);
        }

        // --- 2. CUSTOM DECK FUNCTIONS ---
        function toggleDeckModal() {
            document.getElementById('deckModal').classList.toggle('hidden');
            renderDecksManager();
        }

        function createNewDeck() {
            let input = document.getElementById('newDeckName');
            let name = input.value.trim();
            if(!name) return;
            if(customDecks[name]) {
                alert('Deck already exists!');
                return;
            }
            customDecks[name] = [];
            input.value = '';
            savePersistentState();
            renderDecksManager();
        }

        function deleteDeck(deckName) {
            if(confirm(`Delete deck "${deckName}"?`)) {
                delete customDecks[deckName];
                if(activeDeckFilter === deckName) activeDeckFilter = null;
                savePersistentState();
                renderDecksManager();
                applyFiltersAndRender();
            }
        }

        function toggleSaveToDeck(postId, deckName) {
            let index = customDecks[deckName].indexOf(postId);
            if(index > -1) {
                customDecks[deckName].splice(index, 1);
            } else {
                customDecks[deckName].push(postId);
            }
            savePersistentState();
            renderDecksManager();
            applyFiltersAndRender();
        }

        function filterByDeck(deckName) {
            activeDeckFilter = (activeDeckFilter === deckName) ? null : deckName;
            toggleDeckModal();
            applyFiltersAndRender();
        }

        function renderDecksManager() {
            let container = document.getElementById('decksListContainer');
            container.innerHTML = '';

            let deckNames = Object.keys(customDecks);
            if(deckNames.length === 0) {
                container.innerHTML = `<p class="text-xs text-neutral-400 text-center py-6">No custom decks created yet.</p>`;
                return;
            }

            deckNames.forEach(deck => {
                let count = customDecks[deck].length;
                let isActive = activeDeckFilter === deck;
                let div = document.createElement('div');
                div.className = `p-3 rounded-xl border ${isActive ? 'border-black bg-amber-50' : 'border-neutral-200 bg-neutral-50'} flex flex-col gap-2`;
                div.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-black">${deck}</span>
                            <span class="text-[10px] bg-neutral-200 px-2 py-0.5 rounded-full font-bold">${count} items</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="filterByDeck('${deck}')" class="px-2 py-1 text-[10px] font-bold border border-neutral-300 rounded bg-white cursor-pointer">${isActive ? 'Viewing' : 'View Deck'}</button>
                            <button onclick="deleteDeck('${deck}')" class="text-red-600 font-bold px-1.5 py-0.5 text-xs cursor-pointer">×</button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // --- 3. FILTERS & SEARCH ---
        function toggleFilterDrawer() {
            document.getElementById('filterDrawer').classList.toggle('hidden');
        }

        function selectAllChapters(select) {
            let checkboxes = document.querySelectorAll('.chapter-chk');
            checkboxes.forEach(chk => {
                chk.checked = select;
                if(select) selectedChapters.add(chk.value);
                else selectedChapters.delete(chk.value);
            });
        }

        function applyChapterFilters() {
            selectedChapters.clear();
            let checkboxes = document.querySelectorAll('.chapter-chk:checked');
            checkboxes.forEach(chk => selectedChapters.add(chk.value));

            savePersistentState();
            toggleFilterDrawer();
            applyFiltersAndRender();
        }

        function clearAllFilters() {
            selectedChapters.clear();
            getAllChapters().forEach(c => selectedChapters.add(c));
            currentSearchQuery = '';
            activeDeckFilter = null;
            document.getElementById('searchInput').value = '';
            localStorage.clear();

            buildChapterFilters();
            applyFiltersAndRender();
        }

        function handleSearch() {
            currentSearchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            savePersistentState();
            applyFiltersAndRender();
        }

        function applyFiltersAndRender() {
            let allChaps = getAllChapters();
            let isFilteringSome = selectedChapters.size > 0 && selectedChapters.size < allChaps.length;

            let badge = document.getElementById('activeFilterBadge');
            let bar = document.getElementById('activeFilterBar');
            let text = document.getElementById('activeFilterText');

            if(isFilteringSome || currentSearchQuery !== '' || activeDeckFilter !== null) {
                badge.classList.remove('hidden');
                bar.classList.remove('hidden');
                let deckText = activeDeckFilter !== null ? `Deck: [${activeDeckFilter}] ` : '';
                let chapText = isFilteringSome ? `${selectedChapters.size} Chapters` : 'All Chapters';
                let searchText = currentSearchQuery !== '' ? ` | Search: "${currentSearchQuery}"` : '';
                text.innerText = `Active Filters -> ${deckText}${chapText}${searchText}`;
            } else {
                badge.classList.add('hidden');
                bar.classList.add('hidden');
            }

            let filtered = MasterDatabase.filter(post => {
                // If viewing a custom deck, ensure post ID is inside it
                if(activeDeckFilter !== null) {
                    if(!customDecks[activeDeckFilter] || !customDecks[activeDeckFilter].includes(post.id)) return false;
                }

                let matchesChapter = selectedChapters.has(post.chapter);
                let matchesSearch = (post.name.toLowerCase().includes(currentSearchQuery) || post.chapter.toLowerCase().includes(currentSearchQuery) || post.subject.toLowerCase().includes(currentSearchQuery));
                return matchesChapter && matchesSearch;
            });

            renderFeed(filtered);
        }

        // --- 4. RENDER ENGINE ---
        function renderFeed(postsToRender) {
            const container = document.getElementById('feedContainer');
            container.innerHTML = '';

            if(postsToRender.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-white border border-neutral-200 rounded-2xl max-w-md w-full mx-auto">
                        <p class="text-xs font-black text-black">No Classifications Found</p>
                        <p class="text-[11px] text-neutral-400 font-semibold mt-1">Try adjusting your filters, deck, or search query.</p>
                    </div>
                `;
                return;
            }

            postsToRender.forEach((post, postIdx) => {
                const cardId = `post-${postIdx}`;
                
                let postEl = document.createElement('div');
                postEl.className = "insta-post bg-white border border-neutral-300 rounded-2xl flex flex-col overflow-hidden relative";
                
                // Check if saved in any deck for quick bookmark display
                let decksWithPost = Object.keys(customDecks).filter(d => customDecks[d].includes(post.id));
                let isBookmarked = decksWithPost.length > 0;

                let headerHTML = `
                    <div class="px-4 py-2.5 bg-[#facc15] border-b border-neutral-300 flex justify-between items-center z-10">
                        <div class="pr-2">
                            <span class="text-[9px] uppercase tracking-wider font-extrabold px-1.5 py-0.5 rounded bg-black text-white">${post.subject} • ${post.chapter}</span>
                            <div class="flex items-center gap-1.5 mt-1">
                                <h2 class="text-xs font-extrabold text-black truncate max-w-[200px]">${post.name}</h2>
                                <!-- Save / Bookmark Icon -->
                                <button onclick="openQuickSaveModal('${post.id}')" class="text-xs cursor-pointer hover:scale-110 transition" title="Save to Deck">
                                    ${isBookmarked ? '🔖' : '📑'}
                                </button>
                            </div>
                        </div>
                        <div class="text-right shrink-0">
                            <span class="text-xs text-black font-extrabold bg-white px-2 py-0.5 border border-neutral-300 rounded card-counter">1/${post.subBranches.length}</span>
                        </div>
                    </div>
                `;

                let carouselHTML = `<div class="flex-1 relative overflow-hidden flex items-center justify-center p-2 bg-[#fffdfa]">`;
                let slidesHTML = `<div class="carousel-track flex h-full w-full transition-transform duration-300 ease-out" id="track-${cardId}">`;

                post.subBranches.forEach((branch, bIdx) => {
                    slidesHTML += `
                        <div class="carousel-slide min-w-full h-full flex flex-col justify-center perspective-1000 px-1">
                            <div class="w-full h-full relative transform-style-3d transition-transform duration-500 cursor-pointer card-inner rounded-xl bg-white border border-neutral-200" ondblclick="toggleFlip(this)">
                                
                                <div class="backface-hidden absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-white rounded-xl">
                                    <h3 class="text-xl font-black text-black leading-tight mb-2">${branch.subBranchName}</h3>
                                    <span class="absolute bottom-4 text-[10px] font-extrabold text-amber-600 bg-amber-50 px-3 py-1 border border-neutral-200 rounded-full">⚡ Double tap to flip</span>
                                </div>

                                <div class="backface-hidden absolute inset-0 rotate-y-180 flex flex-col p-4 bg-white rounded-xl overflow-hidden">
                                    <div class="flex justify-between items-center border-b border-neutral-200 pb-2 mb-2 bg-[#fef08a]/60 -mx-4 -mt-4 px-4 pt-4">
                                        <h4 class="text-xs font-black text-black truncate max-w-[220px]">${branch.subBranchName}</h4>
                                        <span class="text-[9px] font-extrabold bg-black text-white px-1.5 py-0.5 rounded">DRUGS</span>
                                    </div>
                                    <div class="flex-1 overflow-y-auto custom-scroll space-y-2 pr-1">
                                        ${branch.drugs && branch.drugs.length > 0 ? branch.drugs.map(drug => `
                                            <div class="bg-neutral-50 border border-neutral-200 p-2 rounded-lg">
                                                <div class="text-xs font-black text-black">${drug.name}</div>
                                                ${drug.note ? `<div class="text-[10px] text-neutral-500 font-medium mt-0.5 leading-tight">${drug.note}</div>` : ''}
                                            </div>
                                        `).join('') : '<div class="text-xs text-neutral-400 text-center py-8 font-semibold">No specific drugs listed.</div>'}
                                    </div>
                                    <div class="text-center pt-2 border-t border-neutral-200 text-[9px] font-bold text-neutral-400">Double tap to flip back</div>
                                </div>

                            </div>
                        </div>
                    `;
                });

                slidesHTML += `</div>`;
                carouselHTML += slidesHTML + `</div>`;

                let dotsHTML = `
                    <div class="py-2 bg-white border-t border-neutral-200 flex justify-center items-center gap-1.5 z-10" id="dots-${cardId}">
                        ${post.subBranches.map((_, dIdx) => `
                            <span onclick="goToSlide('${cardId}', ${dIdx})" class="h-1.5 rounded-full transition-all cursor-pointer border border-neutral-300 ${dIdx === 0 ? 'w-4 bg-[#facc15]' : 'w-1.5 bg-neutral-200'}"></span>
                        `).join('')}
                    </div>
                `;

                postEl.innerHTML = headerHTML + carouselHTML + dotsHTML;
                container.appendChild(postEl);

                setupTouchSwipe(cardId, post.subBranches.length);
            });
        }

        // Quick Save Modal helper
        function openQuickSaveModal(postId) {
            let deckNames = Object.keys(customDecks);
            if(deckNames.length === 0) {
                if(confirm("No custom decks found. Would you like to create one now?")) {
                    toggleDeckModal();
                }
                return;
            }
            
            let deckListStr = deckNames.map((d, i) => `${i+1}. ${d} ${customDecks[d].includes(postId) ? '(Saved ✓)' : ''}`).join('\n');
            let choice = prompt(`Select deck number to toggle saving this card:\n\n${deckListStr}`);
            if(choice !== null) {
                let idx = parseInt(choice) - 1;
                if(deckNames[idx]) {
                    toggleSaveToDeck(postId, deckNames[idx]);
                }
            }
        }

        // --- 5. BUILD CHAPTER FILTER LIST ---
        function buildChapterFilters() {
            let map = {};
            MasterDatabase.forEach(p => {
                if(!map[p.subject]) map[p.subject] = new Set();
                map[p.subject].add(p.chapter);
            });

            let container = document.getElementById('chapterFilterList');
            container.innerHTML = '';

            for(let subj in map) {
                let div = document.createElement('div');
                div.className = "mb-3";
                div.innerHTML = `<h4 class="text-xs font-black uppercase text-neutral-400 mb-1.5">${subj}</h4>`;
                
                let list = document.createElement('div');
                list.className = "space-y-1.5";

                map[subj].forEach(chap => {
                    let isChecked = selectedChapters.has(chap);
                    let label = document.createElement('label');
                    label.className = "flex items-center gap-2 text-xs font-bold text-black cursor-pointer bg-neutral-50 p-2 rounded-lg border border-neutral-200 hover:bg-amber-50";
                    label.innerHTML = `
                        <input type="checkbox" value="${chap}" ${isChecked ? 'checked' : ''} class="chapter-chk w-3.5 h-3.5 accent-black rounded cursor-pointer">
                        <span>${chap}</span>
                    `;
                    list.appendChild(label);
                });

                div.appendChild(list);
                container.appendChild(div);
            }
        }

        // --- 6. INTERACTIONS ---
        let currentSlides = {};

        function toggleFlip(cardInner) {
            cardInner.classList.toggle('rotate-y-180');
        }

        function goToSlide(cardId, index) {
            currentSlides[cardId] = index;
            updateCarouselView(cardId);
        }

        function updateCarouselView(cardId) {
            let idx = currentSlides[cardId] || 0;
            let track = document.getElementById(`track-${cardId}`);
            track.style.transform = `translateX(-${idx * 100}%)`;

            let postContainer = track.closest('.insta-post');
            let total = track.children.length;
            postContainer.querySelector('.card-counter').innerText = `${idx + 1}/${total}`;

            let dots = postContainer.querySelectorAll(`#dots-${cardId} span`);
            dots.forEach((dot, dIdx) => {
                if(dIdx === idx) {
                    dot.className = "h-1.5 rounded-full transition-all cursor-pointer border border-neutral-300 w-4 bg-[#facc15]";
                } else {
                    dot.className = "h-1.5 rounded-full transition-all cursor-pointer border border-neutral-300 w-1.5 bg-neutral-200";
                }
            });
        }

        function setupTouchSwipe(cardId, totalSlides) {
            let track = document.getElementById(`track-${cardId}`);
            let startX = 0;
            let endX = 0;

            track.addEventListener('touchstart', e => {
                startX = e.changedTouches[0].screenX;
            }, {passive: true});

            track.addEventListener('touchend', e => {
                endX = e.changedTouches[0].screenX;
                handleSwipe(cardId, startX, endX, totalSlides);
            }, {passive: true});
        }

        function handleSwipe(cardId, startX, endX, totalSlides) {
            if(!currentSlides[cardId]) currentSlides[cardId] = 0;
            let threshold = 40;
            if (startX - endX > threshold) {
                if(currentSlides[cardId] < totalSlides - 1) {
                    currentSlides[cardId]++;
                    updateCarouselView(cardId);
                }
            } else if (endX - startX > threshold) {
                if(currentSlides[cardId] > 0) {
                    currentSlides[cardId]--;
                    updateCarouselView(cardId);
                }
            }
        }

        window.onload = function() {
            compileDatabase();
            loadPersistentState();
            buildChapterFilters();
            applyFiltersAndRender();
        };
    </script>
</body>
</html>
